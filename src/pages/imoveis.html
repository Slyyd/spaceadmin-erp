<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <base href="../../">
    <link rel="stylesheet" href="css/style.css">
    <title>Imóveis</title>
</head>

<body>

    <header>
        <h1>SpaceAdmin - ERP</h1>

        <nav>
            <a href="./index.html">Início -
            </a>
            <a href="./src/pages/locadores.html">Cadastrar Locadores -
            </a>
            <a href="./src/pages/configuracoes.html">Configurar dados da empresa -
            </a>
        </nav>

    </header>

    <main>

        <h1>Novo imóvel</h1>

        <form>
            <label>Nome</label><input type="text">
            <br>
            <label>Endereço</label><input type="text">
            <br>
            <label>Cidade</label><input type="text">
            <br>
            <label>UF</label><input type="text">
            <br>
            <label>Abertura</label><input type="time">
            <br>
            <label>Fechamento</label><input type="time">
            <br>
            <label>Descrição</label><input type="text">
            <br>
            <button type="button">Cancelar</button>
            <button type="submit">Salvar</button>
        </form>

        <h1>Nova sala</h1>

        <form>
            <label>Nome</label><input type="text">
            <br>
            <label>Capacidade</label><input type="number">
            <br>
            <label>Valor/hora (R$)</label><input type="number">
            <br>
            <label>Valor diária (R$) — opcional</label><input type="number">
            <br>
            <label>Descrição</label><input type="text">
            <br>
            <label>Equipamentos</label>
            <br>
            <button type="button">Cancelar</button>
            <button type="submit">Salvar</button>
        </form>


    </main>
