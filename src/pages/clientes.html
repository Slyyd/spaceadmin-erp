<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="../../">
  <title>Clientes — ERP Locação de Salas</title>
</head>

<body>
  <!--
  Área principal da aplicação.
  Este elemento funciona como o container onde
  o conteúdo principal do sistema será carregado.
-->
  <section class="app-shell" id="app-shell-root"></section>


  <!--
  Fundo/estrutura responsável por exibir o modal.
  O ID "modal-backdrop" permite que o JavaScript
  controle a abertura e o fechamento da janela.
-->
  <section class="modal-backdrop" id="modal-backdrop">

    <!--
    Formulário utilizado para cadastrar um novo cliente.
    O evento de envio pode ser tratado pelo JavaScript
    através do ID "create-form".
  -->
    <form class="modal" id="create-form">

      <!--
      Título da janela de cadastro.
      Identifica claramente a finalidade do formulário.
    -->
      <h2>Novo cliente</h2>


      <!--
      Área destinada à apresentação de mensagens de erro.
      O JavaScript pode inserir aqui mensagens de validação
      ou problemas ocorridos durante o cadastro.
    -->
      <section id="modal-error"></section>


      <!--
      Campo destinado ao nome completo do cliente.
      O atributo "required" torna o preenchimento obrigatório.
    -->
      <section class="form-field">

        <!-- Identificação do campo de nome. -->
        <label for="f-name">Nome</label>

        <!--
        Campo para inserção do nome do cliente.
        O atributo "required" impede o envio sem preenchimento.
      -->
        <input type="text" id="f-name" required />

      </section>


      <!--
      Campo destinado ao endereço de e-mail do cliente.
    -->
      <section class="form-field">

        <!-- Identificação do campo de e-mail. -->
        <label for="f-email">E-mail</label>

        <!--
        Campo de e-mail.
        O navegador também realiza uma validação básica
        do formato do endereço informado.
      -->
        <input type="email" id="f-email" required />

      </section>


      <!--
      Campo destinado ao telefone do cliente.
      O preenchimento não é obrigatório.
    -->
      <section class="form-field">

        <!-- Identificação do campo de telefone. -->
        <label for="f-phone">Telefone</label>

        <!-- Campo para inserção do telefone. -->
        <input type="tel" id="f-phone" />

      </section>


      <!--
      Campo destinado ao CPF ou CNPJ do cliente.
    -->
      <section class="form-field">

        <!-- Identificação do campo de documento. -->
        <label for="f-document">CPF/CNPJ</label>

        <!--
        Campo para CPF ou CNPJ.
        O placeholder orienta o usuário a informar
        somente os números do documento.
      -->
        <input type="text" id="f-document" placeholder="Somente números" />

      </section>


      <!--
      Área responsável pela opção de criação
      de acesso ao sistema para o cliente.
    -->
      <section class="checkbox-field">

        <!--
        Caixa de seleção que permite ao usuário
        solicitar a criação de um acesso.
      -->
        <input type="checkbox" id="f-create-login" />

        <!--
        Texto explicativo associado à caixa de seleção.
      -->
        <label for="f-create-login">
          Criar acesso ao sistema para este cliente
        </label>

      </section>


      <!--
      Campo destinado à senha provisória do cliente.
      O ID "password-field" permite que o JavaScript
      controle a exibição deste campo.
    -->
      <section class="form-field" id="password-field">

        <!-- Identificação do campo de senha. -->
        <label for="f-password">
          Senha provisória
        </label>

        <!--
        Campo para criação da senha provisória.
        O atributo "minlength" exige pelo menos
        8 caracteres.
      -->
        <input type="password" id="f-password" minlength="8" />

      </section>


      <!--
      Área destinada aos botões de ação do formulário.
    -->
      <section class="modal-actions">

        <!--
        Botão responsável por cancelar o cadastro.
        O tipo "button" impede que ele envie o formulário.
      -->
        <button type="button" class="btn btn--outline" id="cancel-btn">
          Cancelar
        </button>


        <!--
        Botão responsável por enviar o formulário
        e concluir o cadastro do cliente.
      -->
        <button type="submit" class="btn btn--primary">
          Salvar
        </button>

      </section>

    </form>

  </section>

  <footer>
    <hr>
    <section>
      <h3>SpaceAdmin©</h3>
      <small>
        <p>Copyright 2026 - 2026</p>
      </small>
    </section>

    <section>
      <nav>

        <a href="index.html" type="_self">Início</a>
        <a href="/src/pages/portifolio.html" type="_self">Nosso portifólio</a>

      </nav>
    </section>

  </footer>

</body>

</html>
