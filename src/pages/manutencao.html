<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <base href="../../">
    <title>Manutenção</title>
    <style>
        form {
            display: flex;
            flex-direction: column;
            width: 300px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Ordem de Serviço - Manutenção</h1>
    </header>



    <main>

        <form id="formManutencao">

            <label>ID da Sala:</label>
            <input type="number" name="sala">

            <label>ID do Imóvel:</label>
            <input type="number" name="imovel">

            <label>ID do Funcionário:</label>
            <input type="number" name="funcionario">

            <label>ID da Reserva:</label>
            <input type="number" name="reserva">

            <label>Descrição:</label>
            <input type="text" name="descricao">

            <label>Prioridade:</label>
            <select name="prioridade">
                <option value="">Selecione</option>
                <option value="Baixa">Baixa</option>
                <option value="Média">Média</option>
                <option value="Alta">Alta</option>
            </select>

            <label>Status:</label>
            <select name="status">
                <option value="">Selecione</option>
                <option value="Pendente">Pendente</option>
                <option value="Em andamento">Em andamento</option>
                <option value="Concluída">Concluída</option>
            </select>

            <label>Diagnóstico:</label>
            <input type="text" name="diagnostico">

            <label>Solução:</label>
            <input type="text" name="solucao">

            <label>Custo:</label>
            <input type="number" name="custo" step="0.01">

            <label>Data de início:</label>
            <input type="datetime-local" name="inicio">

            <label>Data de conclusão:</label>
            <input type="datetime-local" name="conclusao">

            <input type="submit" value="Cadastrar">
            <input type="reset" value="Limpar">

        </form>

        <h2>Manutenções Cadastradas</h2>

        <table border="1">

            <tr>
                <th>Sala</th>
                <th>Imóvel</th>
                <th>Descrição</th>
                <th>Prioridade</th>
                <th>Status</th>
                <th>Custo</th>
            </tr>

            <tbody id="tabelaManutencao">
            </tbody>

        </table>


    </main>

    <footer>
        <hr>
        <section>
            <h3>SpaceAdmin©</h3>
            <small>
                <p>Copyright 2026 - 2026</p>
            </small>
        </section>

        <section>
            <nav>

                <a href="index.html" type="_self">Início</a>
                <a href="src/pages/portifolio.html" type="_self">Nosso portifólio</a>

            </nav>
        </section>

    </footer>

    <script>

        document.getElementById("formManutencao").addEventListener("submit", function (event) {

            //Impede a pagina de recarregar
            event.preventDefault();

            // Pega os valores preenchidos
            let sala = document.querySelector('input[name="sala"]').value;
            let imovel = document.querySelector('input[name="imovel"]').value;
            let descricao = document.querySelector('input[name="descricao"]').value;
            let prioridade = document.querySelector('select[name="prioridade"]').value;
            let status = document.querySelector('select[name="status"]').value;
            let custo = document.querySelector('input[name="custo"]').value;

            // Encontra a tabela
            let tabela = document.getElementById("tabelaManutencao");

            // Cria uma nova linha
            let linha = tabela.insertRow();

            // Coloca os dados nas células
            linha.insertCell(0).innerHTML = sala;
            linha.insertCell(1).innerHTML = imovel;
            linha.insertCell(2).innerHTML = descricao;
            linha.insertCell(3).innerHTML = prioridade;
            linha.insertCell(4).innerHTML = status;
            linha.insertCell(5).innerHTML = custo;

            // Limpa o formulário
            document.getElementById("formManutencao").reset();

        });

    </script>

</body>

</html>
